name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish
      run: |
        dotnet publish app/GHelper.sln --configuration Release --runtime win-x64 -p:PublishSingleFile=true --no-self-contained

    - name: Upload publish output
      uses: actions/upload-artifact@v4
      with:
       name: publish-output
       path: app/bin/x64/Release/net8.0-windows/win-x64/publish/

  dynamic-detection:
      runs-on: ubuntu-latest
      needs: release
      
      steps:
        - uses: actions/checkout@v4

        - name: Setup Java 21 (Temurin)
          uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '21'
    
        # 👉 Artifact laden
        - name: Download publish output
          uses: actions/download-artifact@v4
          with:
            name: publish-output
            path: ./publish
    
        # 👉 Syft installieren
        - name: Install Syft
          run: |
            curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
    
        # 👉 Detector
        - name: Run detector
          run: java -jar dynamicDetection/detectionSystem-1.0-SNAPSHOT-all.jar . #/publish
    
        # 👉 Ergebnisse speichern
        - name: Upload detection results
          uses: actions/upload-artifact@v4
          with:
            name: detection-results
            path: |
              dynamic-detection-results.xlsx
              sbom-output.json
